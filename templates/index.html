<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cổng thông tin danh mục và nạp văn bản quy phạm pháp luật PCCC đa đơn vị.">
    <title>Cổng Thông Tin Văn Bản PCCC</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #080d1a;
            --bg-secondary: rgba(17, 24, 43, 0.7);
            --bg-tertiary: rgba(10, 15, 30, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            
            --status-pending: #f59e0b;
            --status-active: #10b981;
            --status-expired: #ef4444;
            --status-superseded: #71717a;
            
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --font-main: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 3rem;
        }

        /* Decorative radial glows */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: -200px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -200px;
            left: -200px;
            z-index: 0;
            pointer-events: none;
        }

        /* Top navigation header */
        header {
            background: rgba(17, 24, 43, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.2));
        }

        .brand i {
            -webkit-text-fill-color: initial;
            color: #6366f1;
        }

        /* Simulator controls */
        .simulator-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .context-selector {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .context-selector label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            background: rgba(8, 13, 26, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            font-family: var(--font-main);
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%239ca3af%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
        }

        select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* Active profile tag */
        .profile-badge {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .profile-badge i {
            color: var(--accent-primary);
        }

        /* Grid Layout */
        .dashboard-container {
            max-width: 1400px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
            z-index: 1;
        }

        /* Cards and sections */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: fit-content;
        }

        .panel-title {
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .panel-title i {
            color: var(--accent-primary);
        }

        /* Inputs & Form Elements */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: rgba(8, 13, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-trigger {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .file-upload-trigger:hover {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.03);
            color: var(--text-primary);
        }

        .file-upload-trigger i {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .file-selected-info {
            font-size: 0.8rem;
            color: var(--status-active);
            font-weight: 500;
            display: none;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .btn:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            filter: none;
        }

        /* Filters bar */
        .filters-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 150px;
            flex: 1;
        }

        .filter-item label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Catalog container */
        .catalog-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .catalog-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        /* Document card design */
        .doc-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .doc-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .doc-title-sec {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .doc-code {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .doc-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Document status badges */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--status-pending);
        }

        .status-badge.active {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--status-active);
        }

        .status-badge.expired {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--status-expired);
        }

        .status-badge.superseded {
            background: rgba(113, 113, 122, 0.12);
            border-color: rgba(113, 113, 122, 0.3);
            color: var(--status-superseded);
        }

        .doc-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            background: rgba(10, 15, 30, 0.4);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.85rem;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .meta-val {
            font-weight: 600;
        }

        /* File download link and checksum layout */
        .file-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.85rem;
            font-size: 0.8rem;
        }

        .file-link {
            color: var(--accent-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
        }

        .file-link:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        .checksum-info {
            color: var(--text-muted);
            font-family: monospace;
            cursor: help;
            font-size: 0.75rem;
        }

        /* Card actions list */
        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            border-top: 1px solid var(--border-color);
            padding-top: 0.85rem;
        }

        /* Audit Timeline Section */
        .audit-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .audit-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .audit-list::-webkit-scrollbar {
            width: 6px;
        }
        .audit-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .audit-item {
            background: rgba(10, 15, 30, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.825rem;
        }

        .audit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .action-tag {
            font-weight: 700;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .action-tag.create { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .action-tag.update { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .action-tag.replace { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .action-tag.status_change { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        /* Empty states */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            border: 1px dashed var(--border-color);
            border-radius: 16px;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.1);
        }

        /* Replace modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0d1527;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast.success { border-color: rgba(16, 185, 129, 0.4); background: #064e3b; }
        .toast.error { border-color: rgba(239, 68, 68, 0.4); background: #7f1d1d; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Layout modifications */
        main {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
    </style>
</head>
<body>

    <!-- Header bar với chức năng giả lập ngữ cảnh -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i>
            <span>CỔNG THÔNG TIN VĂN BẢN PCCC</span>
        </div>
        
        <div class="simulator-controls">
            <!-- Giả lập tài khoản người dùng -->
            <div class="context-selector">
                <label for="userSelect">Tài Khoản Giả Lập</label>
                <select id="userSelect" onchange="onUserChanged()">
                    <!-- Được điền động qua JS -->
                </select>
            </div>
            
            <!-- Hiển thị đơn vị (tenant) đang hoạt động -->
            <div class="context-selector">
                <label>Đơn Vị Đang Hoạt Động</label>
                <div class="profile-badge">
                    <i class="fa-solid fa-server"></i>
                    <span id="activeTenantLabel">Đang tải...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Grid Dashboard -->
    <div class="dashboard-container">
        
        <!-- Khối bên trái: Nạp Văn Bản mới -->
        <aside class="panel">
            <div class="panel-title">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Nạp Văn Bản Mới (UC-A0-02)</span>
            </div>
            
            <form id="uploadForm" onsubmit="onUploadSubmitted(event)">
                <div class="form-group">
                    <label for="docCode">Mã Hiệu Văn Bản *</label>
                    <input type="text" id="docCode" placeholder="Ví dụ: QCVN 06:2022/BXD" required>
                </div>
                
                <div class="form-group">
                    <label for="docTitle">Tên Đầy Đủ Văn Bản *</label>
                    <textarea id="docTitle" placeholder="Ví dụ: Quy chuẩn kỹ thuật quốc gia về an toàn cháy cho nhà và công trình..." required style="min-height: 70px;"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="docIssuer">Cơ Quan Ban Hành *</label>
                    <input type="text" id="docIssuer" placeholder="Ví dụ: Bộ Xây dựng" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="form-group">
                        <label for="docReleaseDate">Ngày Ban Hành *</label>
                        <input type="text" id="docReleaseDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" required>
                    </div>
                    <div class="form-group">
                        <label for="docEffectiveDate">Ngày Có Hiệu Lực *</label>
                        <input type="text" id="docEffectiveDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="supersedeSelect">Thay Thế Cho Văn Bản (Không bắt buộc)</label>
                    <select id="supersedeSelect">
                        <option value="">-- Không (Văn bản mới) --</option>
                        <!-- Được điền động qua JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Chọn File PDF Văn Bản *</label>
                    <label for="docFileInput" class="file-upload-trigger">
                        <i class="fa-regular fa-file-pdf"></i>
                        <span id="filePromptText">Chọn File PDF</span>
                        <span class="file-selected-info" id="fileSelectedInfo"></span>
                    </label>
                    <input type="file" id="docFileInput" accept=".pdf" onchange="onFileSelected(event)" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="uploadSubmitBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Nạp Văn Bản</span>
                </button>
            </form>
        </aside>

        <!-- Right Panels: Catalog Viewer, Filter Bar, and Audit Log -->
        <main>
            <!-- Filters Bar -->
            <section class="filters-panel">
                <div class="filter-item" style="flex: 2; min-width: 200px;">
                    <label for="filterCode">Tìm Kiếm Theo Mã Hiệu</label>
                    <input type="text" id="filterCode" placeholder="Nhập mã hiệu cần tìm..." oninput="fetchCatalog()">
                </div>
                
                <div class="filter-item">
                    <label for="filterStatus">Trạng Thái</label>
                    <select id="filterStatus" onchange="fetchCatalog()">
                        <option value="">Tất Cả Trạng Thái</option>
                        <option value="CHO_XU_LY_NOI_DUNG">Chờ Xử Lý Nội Dung</option>
                        <option value="HIEU_LUC">Đang Có Hiệu Lực</option>
                        <option value="HET_HIEU_LUC">Hết Hiệu Lực</option>
                        <option value="BI_THAY_THE">Bị Thay Thế</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="filterStartDate">Từ Ngày</label>
                    <input type="text" id="filterStartDate" placeholder="dd/mm/yyyy">
                </div>

                <div class="filter-item">
                    <label for="filterEndDate">Đến Ngày</label>
                    <input type="text" id="filterEndDate" placeholder="dd/mm/yyyy">
                </div>

                <button class="btn btn-secondary" onclick="resetFilters()">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                    <span>Đặt Lại</span>
                </button>
            </section>

            <!-- Danh mục văn bản -->
            <section class="catalog-container">
                <div class="panel-title" style="border: none; padding-bottom: 0;">
                    <i class="fa-solid fa-cabinet-filing" style="color: var(--accent-primary);"></i>
                    <span>Danh Mục Văn Bản Quy Phạm (UC-A0-01)</span>
                </div>
                
                <div class="catalog-list" id="catalogList">
                    <!-- Các thẻ văn bản được điền động qua JS -->
                </div>
            </section>

            <!-- Khối hiển thị nhật ký Audit -->
            <section class="audit-section">
                <div class="panel-title" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
                    <i class="fa-solid fa-list-check" style="color: var(--accent-secondary);"></i>
                    <span>Nhật Ký Đơn Vị (Observer Logs)</span>
                </div>
                <div class="audit-list" id="auditList">
                    <!-- Nhật ký hoạt động được điền động qua JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal thay thế file PDF nguồn -->
    <div class="modal" id="replaceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 1.15rem; font-weight: 600;">Thay Thế File PDF Nguồn</h3>
                <button class="btn" style="background: transparent; color: var(--text-secondary); cursor: pointer; padding: 0.25rem;" onclick="closeReplaceModal()">
                    <i class="fa-solid fa-xmark" style="font-size: 1.25rem;"></i>
                </button>
            </div>
            
            <input type="hidden" id="replaceDocId">
            <p style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">
                Bạn đang cập nhật tệp đính kèm cho văn bản <strong id="replaceDocCode" style="color: var(--accent-primary);"></strong>. Hành động này sẽ tăng số phiên bản của văn bản và đặt lại trạng thái về <strong>Chờ Xử Lý Nội Dung</strong>.
            </p>
            
            <form id="replaceForm" onsubmit="onReplaceSubmitted(event)">
                <div class="form-group">
                    <label>Chọn File PDF Nguồn Mới *</label>
                    <label for="replaceFileInput" class="file-upload-trigger">
                        <i class="fa-regular fa-file-pdf"></i>
                        <span id="replaceFilePromptText">Chọn File PDF Mới</span>
                        <span class="file-selected-info" id="replaceFileSelectedInfo"></span>
                    </label>
                    <input type="file" id="replaceFileInput" accept=".pdf" onchange="onReplaceFileSelected(event)" required>
                </div>

                <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="closeReplaceModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="replaceSubmitBtn">Cập Nhật Nguồn</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast popup -->
    <div class="toast" id="toast">
        <i class="fa-solid" id="toastIcon"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        // Global environment variables
        let mockUsers = [];
        let mockTenants = [];
        let currentUser = null;
        let activeTenant = null;

        // UI Element mappings
        const userSelect = document.getElementById('userSelect');
        const activeTenantLabel = document.getElementById('activeTenantLabel');
        const supersedeSelect = document.getElementById('supersedeSelect');
        const catalogList = document.getElementById('catalogList');
        const auditList = document.getElementById('auditList');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        // File upload triggers mapping
        const docFileInput = document.getElementById('docFileInput');
        const filePromptText = document.getElementById('filePromptText');
        const fileSelectedInfo = document.getElementById('fileSelectedInfo');

        const replaceFileInput = document.getElementById('replaceFileInput');
        const replaceFilePromptText = document.getElementById('replaceFilePromptText');
        const replaceFileSelectedInfo = document.getElementById('replaceFileSelectedInfo');

        // Initialize application configurations on DOM load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadMockData();
            await onUserChanged();
            
            // Setup auto-formatting date masks
            setupDateMask('docReleaseDate');
            setupDateMask('docEffectiveDate');
            setupDateMask('filterStartDate');
            setupDateMask('filterEndDate');
        });

        // Load tenants and users from simulated environment DB endpoints
        async function loadMockData() {
            try {
                // Fetch list of tenants (temporarily use Nguyễn Văn A headers to initialize)
                const headers = { 
                    "X-User-ID": "u1111111-1111-1111-1111-111111111111", 
                    "X-Tenant-ID": "t1111111-1111-1111-1111-111111111111" 
                };
                
                const [tenantRes, userRes] = await Promise.all([
                    fetch('/api/tenants', { headers }),
                    fetch('/api/users', { headers })
                ]);
                
                mockTenants = await tenantRes.json();
                mockUsers = await userRes.json();

                // Populate users list
                userSelect.innerHTML = mockUsers.map(u => {
                    const tenant = mockTenants.find(t => t.id === u.tenant_id);
                    const tenantName = tenant ? tenant.ma_tenant : 'Không rõ';
                    
                    let roleLabel = u.vai_tro;
                    if (u.vai_tro === 'ADMIN') roleLabel = 'Quản trị viên';
                    else if (u.vai_tro === 'THAM_TRA_VIEN') roleLabel = 'Thẩm tra viên';
                    else if (u.vai_tro === 'CHUYEN_GIA_PHE_DUYET') roleLabel = 'Phê duyệt viên';

                    return `<option value="${u.id}">${u.ho_ten} (${tenantName} - ${roleLabel})</option>`;
                }).join('');
                
            } catch (err) {
                console.error(err);
                showToast("Không thể tải thông tin cấu hình giả lập.", "error");
            }
        }

        // Action when user changes profile dropdown
        async function onUserChanged() {
            const selectedUserId = userSelect.value;
            currentUser = mockUsers.find(u => u.id === selectedUserId);
            if (!currentUser) return;

            activeTenant = mockTenants.find(t => t.id === currentUser.tenant_id);
            if (!activeTenant) return;

            activeTenantLabel.textContent = `${activeTenant.ten_co_quan} (${activeTenant.ma_tenant})`;
            
            // Re-render UI forms based on user role permissions
            updateFormVisibility();
            
            // Reload scoped records
            await fetchCatalog();
            await fetchAudits();
        }

        // Resolves request headers based on simulated workspace state
        function getHeaders() {
            if (!currentUser || !activeTenant) return {};
            return {
                "X-User-ID": currentUser.id,
                "X-Tenant-ID": activeTenant.id
            };
        }

        // Shows/hides buttons or uploads forms depending on active role permissions
        function updateFormVisibility() {
            const uploadBtn = document.getElementById('uploadSubmitBtn');
            const formsPanel = document.querySelector('aside.panel');
            
            const isInspector = currentUser.vai_tro === 'THAM_TRA_VIEN' || currentUser.vai_tro === 'ADMIN';
            
            // Disable submit form button if user is not inspector/admin
            if (uploadBtn) {
                uploadBtn.disabled = !isInspector;
                uploadBtn.querySelector('span').textContent = isInspector ? "Nạp Văn Bản" : "Vô Hiệu Hóa (Chỉ Thẩm Tra Viên)";
            }
        }

        // Show toast popups
        function showToast(message, type = "success") {
            toastMessage.textContent = message;
            toastIcon.className = type === "success" ? "fa-solid fa-circle-check" : "fa-solid fa-circle-exclamation";
            toastIcon.style.color = type === "success" ? "#34d399" : "#f87171";
            toast.className = `toast show ${type}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Reset search criteria filter
        function resetFilters() {
            document.getElementById('filterCode').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            fetchCatalog();
        }

        // Dynamic change state of custom file triggers
        function onFileSelected(e) {
            const file = e.target.files[0];
            if (file) {
                filePromptText.style.display = 'none';
                fileSelectedInfo.style.display = 'block';
                fileSelectedInfo.textContent = `Đã chọn: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            } else {
                filePromptText.style.display = 'block';
                fileSelectedInfo.style.display = 'none';
            }
        }

        function onReplaceFileSelected(e) {
            const file = e.target.files[0];
            if (file) {
                replaceFilePromptText.style.display = 'none';
                replaceFileSelectedInfo.style.display = 'block';
                replaceFileSelectedInfo.textContent = `Đã chọn: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            } else {
                replaceFilePromptText.style.display = 'block';
                replaceFileSelectedInfo.style.display = 'none';
            }
        }

        // Parse dd/mm/yyyy into yyyy-mm-dd for API calls
        function parseInputDate(value) {
            if (!value) return "";
            const regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
            const match = value.match(regex);
            if (match) {
                const day = match[1];
                const month = match[2];
                const year = match[3];
                return `${year}-${month}-${day}`;
            }
            return "";
        }

        // Apply a clean keypress mask for date inputs (dd/mm/yyyy)
        function setupDateMask(id) {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener('input', (e) => {
                let value = input.value.replace(/\D/g, '');
                if (value.length > 8) value = value.substring(0, 8);
                if (value.length > 4) {
                    input.value = `${value.substring(0, 2)}/${value.substring(2, 4)}/${value.substring(4)}`;
                } else if (value.length > 2) {
                    input.value = `${value.substring(0, 2)}/${value.substring(2)}`;
                } else {
                    input.value = value;
                }
                
                if (id === 'filterStartDate' || id === 'filterEndDate') {
                    onFilterDateInput();
                }
            });
        }

        function onFilterDateInput() {
            const startVal = document.getElementById('filterStartDate').value;
            const endVal = document.getElementById('filterEndDate').value;
            
            // Trigger fetch only if date is complete (10 chars) or empty
            const isStartOk = !startVal || startVal.length === 10;
            const isEndOk = !endVal || endVal.length === 10;
            
            if (isStartOk && isEndOk) {
                fetchCatalog();
            }
        }

        // Fetch catalog of documents
        async function fetchCatalog() {
            try {
                const codeVal = document.getElementById('filterCode').value;
                const statusVal = document.getElementById('filterStatus').value;
                const startVal = document.getElementById('filterStartDate').value;
                const endVal = document.getElementById('filterEndDate').value;

                let url = '/api/documents?';
                if (codeVal) url += `ma_hieu=${encodeURIComponent(codeVal)}&`;
                if (statusVal) url += `trang_thai=${encodeURIComponent(statusVal)}&`;
                
                // Parse startVal (dd/mm/yyyy -> yyyy-mm-dd)
                const startYMD = parseInputDate(startVal);
                if (startYMD) url += `tu_ngay=${encodeURIComponent(startYMD)}&`;
                
                // Parse endVal (dd/mm/yyyy -> yyyy-mm-dd)
                const endYMD = parseInputDate(endVal);
                if (endYMD) url += `den_ngay=${encodeURIComponent(endYMD)}&`;

                const res = await fetch(url, { headers: getHeaders() });
                if (!res.ok) throw new Error("Tải danh mục văn bản thất bại.");
                
                const docs = await res.json();
                renderCatalog(docs);
                populateSupersedeDropdown(docs);
            } catch (err) {
                console.error(err);
                catalogList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color: var(--status-expired);"></i><p>${err.message}</p></div>`;
            }
        }

        // Populate the dropdown to supersede older records
        function populateSupersedeDropdown(docs) {
            // Only suggest active/effective documents to supersede
            const activeDocs = docs.filter(d => d.trang_thai === 'HIEU_LUC');
            
            supersedeSelect.innerHTML = '<option value="">-- Không (Văn bản mới) --</option>' + 
                activeDocs.map(d => `<option value="${d.id}">${d.ma_hieu} v${d.version} - ${d.ten_day_du.substring(0, 45)}...</option>`).join('');
        }

        // Format dates nicely to dd/mm/yyyy
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return 'N/A';
            const d = new Date(dateTimeStr);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // Render documents lists
        function renderCatalog(docs) {
            if (!docs || docs.length === 0) {
                catalogList.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <p>Không tìm thấy văn bản quy phạm nào trong danh mục cơ quan này.</p>
                    </div>
                `;
                return;
            }

            const isInspector = currentUser.vai_tro === 'THAM_TRA_VIEN' || currentUser.vai_tro === 'ADMIN';
            const isApprover = currentUser.vai_tro === 'CHUYEN_GIA_PHE_DUYET' || currentUser.vai_tro === 'ADMIN';

            catalogList.innerHTML = docs.map((doc, idx) => {
                let statusClass = 'pending';
                let statusLabel = 'Chờ xử lý nội dung';
                if (doc.trang_thai === 'HIEU_LUC') { statusClass = 'active'; statusLabel = 'Đang có hiệu lực'; }
                else if (doc.trang_thai === 'HET_HIEU_LUC') { statusClass = 'expired'; statusLabel = 'Hết hiệu lực'; }
                else if (doc.trang_thai === 'BI_THAY_THE') { statusClass = 'superseded'; statusLabel = 'Bị thay thế'; }

                return `
                    <div class="doc-card" style="animation-delay: ${idx * 0.05}s">
                        <div class="doc-header">
                            <div class="doc-title-sec">
                                <span class="doc-code">${escapeHtml(doc.ma_hieu)} <span style="color: var(--text-muted); font-weight: normal; margin-left: 0.5rem;">Phiên bản ${doc.version}</span></span>
                                <h3 class="doc-title">${escapeHtml(doc.ten_day_du)}</h3>
                            </div>
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        
                        <div class="doc-meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">Cơ quan ban hành</span>
                                <span class="meta-val">${escapeHtml(doc.co_quan_ban_hanh)}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Ngày ban hành</span>
                                <span class="meta-val">${formatDate(doc.ngay_ban_hanh)}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Ngày có hiệu lực</span>
                                <span class="meta-val">${formatDate(doc.ngay_hieu_luc)}</span>
                            </div>
                        </div>

                        ${doc.file_url ? `
                        <div class="file-section">
                            <a href="${doc.file_url}" target="_blank" class="file-link">
                                <i class="fa-solid fa-file-pdf" style="font-size: 1.1rem;"></i>
                                <span>Tải File PDF Nguồn</span>
                            </a>
                            <span class="checksum-info" title="Mã SHA-256: ${doc.file_checksum}">
                                <i class="fa-solid fa-fingerprint"></i>
                                ${doc.file_checksum.substring(0, 10)}...
                            </span>
                        </div>
                        ` : `
                        <div class="file-section" style="color: var(--status-expired);">
                            <span><i class="fa-solid fa-triangle-exclamation"></i> Chưa đính kèm file PDF</span>
                        </div>
                        `}

                        <!-- Các hành động của thẻ dựa trên phân quyền người dùng -->
                        <div class="card-actions">
                            ${isInspector && doc.trang_thai !== 'BI_THAY_THE' ? `
                                <button class="btn btn-secondary btn-sm" onclick="openReplaceModal('${doc.id}', '${escapeHtml(doc.ma_hieu)}')">
                                    <i class="fa-solid fa-file-signature"></i>
                                    Thay thế PDF
                                </button>
                            ` : ''}

                            ${isApprover && doc.trang_thai === 'CHO_XU_LY_NOI_DUNG' ? `
                                <button class="btn btn-primary btn-sm" style="background: var(--status-active); box-shadow: none;" onclick="updateStatus('${doc.id}', 'HIEU_LUC')">
                                    <i class="fa-solid fa-circle-check"></i>
                                    Phê duyệt
                                </button>
                            ` : ''}

                            ${isApprover && doc.trang_thai === 'HIEU_LUC' ? `
                                <button class="btn btn-secondary btn-sm" style="color: var(--status-expired); border-color: rgba(239, 68, 68, 0.2);" onclick="updateStatus('${doc.id}', 'HET_HIEU_LUC')">
                                    <i class="fa-solid fa-box-archive"></i>
                                    Lưu trữ / Thu hồi
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Escapes text for HTML protection
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Fetch Audit trails scoped by current tenant
        async function fetchAudits() {
            try {
                const res = await fetch('/api/audit-logs', { headers: getHeaders() });
                if (!res.ok) throw new Error();
                const logs = await res.json();
                renderAudits(logs);
            } catch (err) {
                console.error(err);
                auditList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 2rem 0;">Tải nhật ký hoạt động thất bại.</div>';
            }
        }

        // Render audit items
        function renderAudits(logs) {
            if (!logs || logs.length === 0) {
                auditList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 2rem 0;"><i class="fa-regular fa-clock" style="margin-right: 0.25rem;"></i> Chưa ghi nhận hành động nào tại cơ quan này.</div>';
                return;
            }

            auditList.innerHTML = logs.map(log => {
                let tagClass = 'create';
                let tagLabel = log.action;
                if (log.action === 'CREATE') tagLabel = 'Tạo mới';
                else if (log.action === 'UPDATE') { tagClass = 'update'; tagLabel = 'Cập nhật'; }
                else if (log.action === 'REPLACE') { tagClass = 'replace'; tagLabel = 'Thay thế'; }
                else if (log.action === 'STATUS_CHANGE') { tagClass = 'status_change'; tagLabel = 'Trạng thái'; }

                // Map performer ID to mock names (show full name for Vietnamese names)
                const performer = mockUsers.find(u => u.id === log.performed_by);
                const performerName = performer ? performer.ho_ten : 'Hệ thống';

                return `
                    <div class="audit-item">
                        <div class="audit-header">
                            <span class="action-tag ${tagClass}">${tagLabel}</span>
                            <span>${formatDateTime(log.performed_at)}</span>
                        </div>
                        <p style="font-weight: 500;">Người thực hiện: <span style="color: var(--accent-primary);">${performerName}</span></p>
                        <p style="color: var(--text-secondary); font-size: 0.8rem; line-height: 1.3;">${escapeHtml(log.detail)}</p>
                    </div>
                `;
            }).join('');
        }

        // Upload Form handler submission
        async function onUploadSubmitted(e) {
            e.preventDefault();
            
            const file = docFileInput.files[0];
            if (!file) {
                showToast("Vui lòng chọn file PDF nguồn.", "error");
                return;
            }

            const code = document.getElementById('docCode').value.trim();
            const title = document.getElementById('docTitle').value.trim();
            const issuer = document.getElementById('docIssuer').value.trim();
            const releaseRaw = document.getElementById('docReleaseDate').value;
            const effectiveRaw = document.getElementById('docEffectiveDate').value;
            
            const release = parseInputDate(releaseRaw);
            const effective = parseInputDate(effectiveRaw);
            
            if (!release || !effective) {
                showToast("Vui lòng nhập ngày hợp lệ dạng dd/mm/yyyy.", "error");
                return;
            }
            
            const supersede = supersedeSelect.value;

            // Submit using FormData to support UploadFile
            const formData = new FormData();
            formData.append("ma_hieu", code);
            formData.append("ten_day_du", title);
            formData.append("co_quan_ban_hanh", issuer);
            formData.append("ngay_ban_hanh", release);
            formData.append("ngay_hieu_luc", effective);
            if (supersede) {
                formData.append("replaces_document_id", supersede);
            }
            formData.append("file", file);

            const submitBtn = document.getElementById('uploadSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = 'Đang nạp lên...';

            try {
                const res = await fetch('/api/documents/upload', {
                    method: 'POST',
                    headers: {
                        'X-User-ID': currentUser.id,
                        'X-Tenant-ID': activeTenant.id
                    },
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Kiểm tra dữ liệu hoặc tải lên thất bại.");
                }

                showToast("Đã nạp văn bản quy phạm thành công!");
                document.getElementById('uploadForm').reset();
                filePromptText.style.display = 'block';
                fileSelectedInfo.style.display = 'none';

                await fetchCatalog();
                await fetchAudits();
            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = 'Nạp Văn Bản';
            }
        }

        // Approve or Archive Status change handler
        async function updateStatus(docId, newStatus) {
            try {
                const res = await fetch(`/api/documents/${docId}/status?status=${newStatus}`, {
                    method: 'PUT',
                    headers: getHeaders()
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Chuyển trạng thái thất bại.");
                }

                showToast(`Đã chuyển trạng thái văn bản thành công.`);
                await fetchCatalog();
                await fetchAudits();
            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            }
        }

        // Open modal for file replacements
        function openReplaceModal(docId, docCode) {
            document.getElementById('replaceDocId').value = docId;
            document.getElementById('replaceDocCode').textContent = docCode;
            
            // Reset modal file fields
            replaceFileInput.value = '';
            replaceFilePromptText.style.display = 'block';
            replaceFileSelectedInfo.style.display = 'none';

            document.getElementById('replaceModal').classList.add('show');
        }

        function closeReplaceModal() {
            document.getElementById('replaceModal').classList.remove('show');
        }

        // Replace Form handler submission
        async function onReplaceSubmitted(e) {
            e.preventDefault();
            const docId = document.getElementById('replaceDocId').value;
            const file = replaceFileInput.files[0];
            if (!file) {
                showToast("Vui lòng chọn file PDF nguồn mới.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            const submitBtn = document.getElementById('replaceSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang cập nhật...';

            try {
                const res = await fetch(`/api/documents/${docId}/replace`, {
                    method: 'PUT',
                    headers: {
                        'X-User-ID': currentUser.id,
                        'X-Tenant-ID': activeTenant.id
                    },
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Thay thế file PDF thất bại.");
                }

                showToast("Đã thay thế file PDF nguồn và tăng phiên bản!");
                closeReplaceModal();
                await fetchCatalog();
                await fetchAudits();
            } catch (err) {
                console.error(err);
                showToast(err.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Source';
            }
        }
    </script>
</body>
</html>
